<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Work Hours Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 8px; text-align: center; border: 1px solid #ccc; }
    input { width: 60px; padding: 5px; }
    #total { font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Monthly Work Hours Calculator</h2>

  <label for="month">Month:</label>
  <input type="text" id="month" placeholder="March"><br><br>

  <table id="inputTable">
    <tr>
      <th>Day</th>
      <th>Hours</th>
      <th>Minutes</th>
    </tr>
  </table>

  <button onclick="calculateTotal()">Calculate Total</button>

  <div id="total"></div>

  <script>
    const table = document.getElementById('inputTable');

    // Add 31 rows for each day
    for (let i = 1; i <= 31; i++) {
      const row = table.insertRow();
      row.innerHTML = `
        <td>${i}</td>
        <td><input type="number" min="0" max="24" id="h${i}"></td>
        <td><input type="number" min="0" max="59" id="m${i}"></td>
      `;
    }

    function calculateTotal() {
      let totalHours = 0;
      let totalMinutes = 0;

      for (let i = 1; i <= 31; i++) {
        const h = parseInt(document.getElementById(`h${i}`).value) || 0;
        const m = parseInt(document.getElementById(`m${i}`).value) || 0;

        totalHours += h;
        totalMinutes += m;
      }

      // Convert minutes to hours if > 60
      totalHours += Math.floor(totalMinutes / 60);
      totalMinutes = totalMinutes % 60;

      const month = document.getElementById('month').value || "Selected Month";
      document.getElementById('total').textContent = 
        `Total for ${month}: ${totalHours} hours and ${totalMinutes} minutes`;
    }
  </script>
</body>
</html>
